name: Raspberry-Container bauen

on:
  push:
    branches: [main, "codex/raspberry-docker"]
    tags: ["v*"]
    paths:
      - "app/**"
      - "build/**"
      - "deploy/docker/**"
      - "deploy/raspberry/backup.sh"
      - "postgres/**"
      - "public/**"
      - "raspberry/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "app/**"
      - "build/**"
      - "deploy/docker/**"
      - "deploy/raspberry/backup.sh"
      - "postgres/**"
      - "public/**"
      - "raspberry/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/container.yml"
  workflow_dispatch:

concurrency:
  group: raspberry-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/rianflow/vereinskasse
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/codex/raspberry-docker' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=1.4.0,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: clubiq-ledger:test
          cache-from: type=gha

      - name: PostgreSQL, App und Sicherung zusammen prüfen
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          sed -i 's|^CLUBIQ_IMAGE=.*|CLUBIQ_IMAGE=clubiq-ledger|' .env
          mkdir -p secrets /tmp/clubiq-usb
          openssl rand -base64 48 | tr -d '\n' > secrets/postgres_admin_password
          openssl rand -base64 48 | tr -d '\n' > secrets/postgres_app_password
          openssl rand -base64 48 | tr -d '\n' > secrets/restic_password
          printf '246802' > secrets/initial_profile_pin
          : > secrets/r2_access_key_id
          : > secrets/r2_secret_access_key
          USB_BACKUP_PATH=/tmp/clubiq-usb docker compose up -d postgres app backup
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' clubiq-ledger-app-1)
            [ "$state" = healthy ] && break
            [ "$state" = unhealthy ] && docker compose logs app postgres && exit 1
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' clubiq-ledger-app-1)" = healthy
          docker compose exec -T app sh -c 'export PGPASSWORD="$(cat "$PGPASSWORD_FILE")"; node raspberry/postgres-admin.mjs check'
          for attempt in $(seq 1 30); do
            if docker compose exec -T backup \
                grep -q '"ok":true' /backups/local/.last-backup.json; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose logs backup app postgres
              exit 1
            fi
            sleep 2
          done

      - if: always()
        working-directory: deploy/docker
        run: docker compose down --volumes --remove-orphans
